name: Unstick behind bot PRs

# Auto-merge waits for a PR to no longer be BEHIND the base branch, but
# nothing proactively updates it in every case: Dependabot only pushes a
# new commit via `@dependabot rebase` when there's an actual conflict, so
# a PR that falls behind purely because a sibling bot PR merged first (and
# advanced the base branch) can get stuck indefinitely with no PR event to
# trigger dependency-pr-automerge.yml's own update-branch step. Run this
# independently of PR events to catch and fix that case.
#
# Dependabot PRs are rebased by asking Dependabot (`@dependabot rebase`):
# - the comment must come from a user with push access. A comment made with
#   the workflow's GITHUB_TOKEN (github-actions) is refused with "only users
#   with push access can use that command". So it is posted with a personal
#   access token: DEPENDABOT_REBASE_TOKEN if set, otherwise the
#   SEMANTIC_RELEASE_TOKEN of the release workflow;
# - update-branch with GITHUB_TOKEN is not used for them because it would make
#   Dependabot refuse later rebases and leave the new head's workflows awaiting
#   approval. update-branch with the personal access token (workflows run
#   normally for its pushes) is the fallback when the token can not comment.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  unstick:
    runs-on: ubuntu-latest
    steps:
      - name: Update behind bot PRs with auto-merge enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REBASE_TOKEN: ${{ secrets.DEPENDABOT_REBASE_TOKEN || secrets.SEMANTIC_RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh pr list --repo "$REPO" --state open \
            --json number,author,autoMergeRequest,mergeStateStatus \
            --jq '.[] | select(.autoMergeRequest != null) | select(.mergeStateStatus == "BEHIND") | select(.author.login | IN("dependabot[bot]", "app/dependabot", "snyk-bot", "app/snyk-bot")) | "\(.number) \(.author.login)"' \
          | while read -r num author; do
              case "$author" in
                *dependabot*)
                  if [ -z "$REBASE_TOKEN" ]; then
                    echo "::warning::PR #$num is behind, but neither DEPENDABOT_REBASE_TOKEN nor SEMANTIC_RELEASE_TOKEN is set. Can not ask Dependabot to rebase."
                    continue
                  fi
                  # do not repeat the request while Dependabot is still working on the previous one
                  head=$(gh pr view "$num" --repo "$REPO" --json headRefOid --jq .headRefOid)
                  head_date=$(gh api "repos/$REPO/commits/$head" --jq .commit.committer.date)
                  last=$(gh api "repos/$REPO/issues/$num/comments" --paginate --jq '.[] | select(.body == "@dependabot rebase") | .created_at' | sort | tail -n 1)
                  limit=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ)
                  if [ -n "$last" ] && [[ "$last" > "$head_date" ]] && [[ "$last" > "$limit" ]]; then
                    echo "PR #$num is behind, rebase was already requested at $last - waiting"
                    continue
                  fi
                  echo "PR #$num is behind with auto-merge enabled - asking Dependabot to rebase"
                  if ! GH_TOKEN="$REBASE_TOKEN" gh pr comment "$num" --repo "$REPO" --body "@dependabot rebase"; then
                    # The token can not comment (e.g. a fine-grained PAT which only has "Contents").
                    # Update the branch with it instead: a push made with a personal access token
                    # runs the workflows normally. Dependabot will not rebase this PR any more.
                    echo "::warning::could not comment on PR #$num, updating the branch with the token instead"
                    GH_TOKEN="$REBASE_TOKEN" gh api --method PUT "repos/$REPO/pulls/$num/update-branch" \
                      || echo "::warning::could not update the branch of PR #$num"
                  fi ;;
                *)
                  echo "PR #$num is behind with auto-merge enabled - requesting branch update"
                  gh api --method PUT "repos/$REPO/pulls/$num/update-branch" || true ;;
              esac
            done
